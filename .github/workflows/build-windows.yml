name: Build Windows EXE

# Builds a standalone Auto-Cleanup.exe on a Windows runner and uploads it.
# - Runs on pushes to the app branch and on manual dispatch.
# - When a tag like v1.0.0 is pushed, the exe is also attached to a Release.

on:
  push:
    branches: ["claude/cleanup-app-development-eomfn8", "main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,desktop]"
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller packaging/Auto-Cleanup.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Cleanup-windows
          path: dist/Auto-Cleanup.exe
          if-no-files-found: error

      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Auto-Cleanup.exe
