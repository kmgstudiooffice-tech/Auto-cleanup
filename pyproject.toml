[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-cleanup"
version = "0.1.0"
description = "安全なクロスOS自動クリーンアップアプリ（大容量/重複/未使用ファイル・未使用アプリの整理）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.4", "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0", "httpx>=0.27"]

[project.scripts]
cleanup = "cleanup.cli:main"

[tool.setuptools.packages.find]
include = ["cleanup*"]

[tool.setuptools.package-data]
"cleanup.web" = ["static/*.html"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
