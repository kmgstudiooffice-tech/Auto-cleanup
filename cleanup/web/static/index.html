<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auto-Cleanup</title>
<style>
  :root { color-scheme: light dark; --safe:#2e7d32; --low:#b8860b; --high:#c62828; --accent:#0a84ff; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.05rem; }
  .toolbar { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin-bottom:1rem; }
  button { padding:.5rem .9rem; border-radius:8px; border:1px solid #8888; background:var(--accent); color:#fff; cursor:pointer; font-size:.9rem; }
  button.secondary { background:transparent; color:inherit; }
  button.danger { background:transparent; color:var(--high); border-color:var(--high); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:.8rem; margin-bottom:1rem; }
  .card { border:1px solid #8884; border-radius:12px; padding:.9rem; display:flex; flex-direction:column; gap:.4rem; }
  .card .top { display:flex; align-items:center; gap:.5rem; }
  .card .emoji { font-size:1.4rem; }
  .card .name { font-weight:600; }
  .card .big { font-size:1.5rem; font-weight:700; }
  .card .meta { font-size:.85rem; opacity:.8; }
  .badge { font-size:.72rem; padding:.05rem .4rem; border-radius:999px; margin-right:.25rem; }
  .badge.safe { background:color-mix(in srgb, var(--safe) 25%, transparent); }
  .badge.low { background:color-mix(in srgb, var(--low) 30%, transparent); }
  .badge.high { background:color-mix(in srgb, var(--high) 25%, transparent); }
  .card .toggle { align-self:flex-start; background:none; border:none; color:var(--accent); padding:0; font-size:.82rem; cursor:pointer; }
  .details { display:none; margin-top:.3rem; }
  .details.open { display:block; }
  table { width:100%; border-collapse:collapse; font-size:.82rem; }
  td, th { padding:.3rem .4rem; border-top:1px solid #8883; text-align:left; }
  td.size { text-align:right; white-space:nowrap; }
  td.path { word-break:break-all; }
  .risk { font-weight:600; } .risk.safe { color:var(--safe); } .risk.low { color:var(--low); } .risk.high { color:var(--high); }
  .summary { font-weight:600; margin:1rem 0; }
  .hint { opacity:.75; font-size:.85rem; }
  .steps { display:flex; gap:.4rem; flex-wrap:wrap; margin:.2rem 0 1rem; }
  .step { font-size:.8rem; padding:.15rem .5rem; border-radius:999px; background:#8882; }
  #result { margin-top:1rem; padding:1rem 1.2rem; border-radius:12px; border:1px solid #8884; }
  #result.ok { border-color:var(--safe); background:color-mix(in srgb, var(--safe) 12%, transparent); }
  #result.dry { border-color:var(--low); background:color-mix(in srgb, var(--low) 12%, transparent); }
  #result h2 { margin:0 0 .4rem; }
  #result ul { margin:.4rem 0; padding-left:1.1rem; }
  code { background:#8882; padding:.1rem .35rem; border-radius:5px; word-break:break-all; }
  .sessions { margin-top:2rem; border-top:1px solid #8884; padding-top:1rem; }
  .session { display:flex; align-items:center; gap:.8rem; justify-content:space-between; border:1px solid #8884; border-radius:10px; padding:.5rem .8rem; margin-bottom:.5rem; }
  dialog { border:none; border-radius:12px; padding:1.5rem; max-width:480px; }
</style>
</head>
<body>
  <h1>🧹 Auto-Cleanup</h1>
  <div class="steps">
    <span class="step">① スキャン（削除しない）</span>
    <span class="step">② 対象を選ぶ</span>
    <span class="step">③ 処理（隔離＝ゴミ箱へ移動）</span>
    <span class="step">④ 必要なら復元</span>
  </div>
  <p class="hint">「処理」は削除ではなく<strong>隔離フォルダへの移動</strong>です。下の「隔離履歴」からいつでも元に戻せます。「実際に隔離する」がオフの間は<strong>ドライラン（練習）</strong>で、ファイルは動きません。</p>

  <div class="toolbar">
    <button id="scanBtn">① スキャン</button>
    <label><input type="checkbox" id="applyChk" /> 実際に隔離する（オフ=ドライラン）</label>
    <button id="cleanBtn" class="secondary" disabled>③ 選択した項目を処理</button>
    <span id="status" class="hint"></span>
  </div>

  <div id="summary" class="summary"></div>
  <div id="categories" class="cards"></div>
  <div id="result" hidden></div>

  <div class="sessions">
    <h2>🗄 隔離履歴（復元できます）</h2>
    <p class="hint" id="sessionsHint">まだ隔離したものはありません。</p>
    <div id="sessionsList"></div>
  </div>

  <dialog id="confirmDlg">
    <h3>実行の確認</h3>
    <p id="confirmText"></p>
    <div style="text-align:right; display:flex; gap:.5rem; justify-content:flex-end;">
      <button class="secondary" id="confirmCancel">キャンセル</button>
      <button id="confirmOk">承認して処理</button>
    </div>
  </dialog>

<script>
const $ = (s) => document.querySelector(s);
let candidates = [];

function human(bytes) {
  const u = ["B","KB","MB","GB","TB"]; let n = bytes, i = 0;
  while (Math.abs(n) >= 1024 && i < u.length-1) { n/=1024; i++; }
  return (i===0? n : n.toFixed(1)) + " " + u[i];
}
const riskClass = (r) => ["safe","low","high"][r] || "low";
const riskLabel = (r) => ["安全","低","高"][r] || "低";

async function scan() {
  $("#status").textContent = "スキャン中…";
  $("#cleanBtn").disabled = true;
  $("#result").hidden = true;
  try {
    const res = await fetch("/api/scan", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
    const data = await res.json();
    candidates = data.candidates;
    render(data);
    $("#status").textContent = `${data.count} 件 / 合計 ${human(data.total_size)}`;
    $("#cleanBtn").disabled = data.count === 0;
  } catch (e) {
    $("#status").textContent = "スキャンに失敗しました: " + e;
  }
}

const CAT_EMOJI = {
  "システムのゴミ(キャッシュ/一時)": "🧽",
  "Windows定番の不要ファイル": "🪟",
  "大容量ファイル": "📦",
  "重複ファイル": "👯",
  "長期間未使用ファイル": "🕸",
  "大容量アプリ": "💽",
  "未使用アプリ": "📱",
};
const DETAIL_LIMIT = 20;  // show at most this many files per category

function riskCounts(items) {
  const c = [0, 0, 0];
  for (const it of items) c[it.risk]++;
  return c;
}

function render(data) {
  const groups = {};
  for (const c of data.candidates) (groups[c.category_label] ||= []).push(c);
  const container = $("#categories");
  container.innerHTML = "";

  for (const [label, items] of Object.entries(groups)) {
    items.sort((a,b)=>b.size-a.size);
    const subtotal = items.reduce((s,c)=>s+c.size,0);
    const [nSafe, nLow, nHigh] = riskCounts(items);

    const card = document.createElement("div");
    card.className = "card";
    const badges = [
      nSafe ? `<span class="badge safe">安全 ${nSafe}</span>` : "",
      nLow ? `<span class="badge low">低 ${nLow}</span>` : "",
      nHigh ? `<span class="badge high">高 ${nHigh}</span>` : "",
    ].join("");

    // Summary-first: emoji, name, big size, count, risk badges, one checkbox.
    card.innerHTML = `
      <div class="top">
        <span class="emoji">${CAT_EMOJI[label] || "🗂"}</span>
        <label class="name"><input type="checkbox" class="catAll" checked> ${label}</label>
      </div>
      <div class="big">${human(subtotal)}</div>
      <div class="meta">${items.length} 件　${badges}</div>
      <button class="toggle" type="button">詳細を表示 ▾</button>
      <div class="details"></div>`;

    // Detail table lives hidden; capped so long lists don't overwhelm.
    const shown = items.slice(0, DETAIL_LIMIT);
    const rows = shown.map(c => `<tr>
        <td><input type="checkbox" class="pick" data-id="${c.id}" data-risk="${c.risk}" ${c.risk<2?"checked":""} ${c.action==="uninstall"?"disabled":""}></td>
        <td class="risk ${riskClass(c.risk)}">${riskLabel(c.risk)}</td>
        <td class="size">${human(c.size)}</td>
        <td class="path">${c.path}${c.uninstall_hint?`<br><span class="hint">削除方法: ${c.uninstall_hint}</span>`:""}</td>
      </tr>`).join("");
    // Any items beyond the cap still get a hidden checkbox so "select all"
    // and processing still cover them, without cluttering the table.
    const extra = items.slice(DETAIL_LIMIT).map(c =>
      `<input type="checkbox" class="pick" data-id="${c.id}" data-risk="${c.risk}" ${c.risk<2?"checked":""} ${c.action==="uninstall"?"disabled":""} hidden>`
    ).join("");
    const moreNote = items.length > DETAIL_LIMIT
      ? `<p class="hint">上位 ${DETAIL_LIMIT} 件のみ表示（残り ${items.length - DETAIL_LIMIT} 件も選択対象です）</p>` : "";
    card.querySelector(".details").innerHTML =
      `<table><tr><th></th><th>リスク</th><th>サイズ</th><th>ファイル</th></tr>${rows}</table>${moreNote}${extra}`;

    const toggle = card.querySelector(".toggle");
    const details = card.querySelector(".details");
    toggle.addEventListener("click", () => {
      const open = details.classList.toggle("open");
      toggle.textContent = open ? "詳細を隠す ▴" : "詳細を表示 ▾";
    });
    card.querySelector(".catAll").addEventListener("change", (e)=>{
      card.querySelectorAll(".pick:not([disabled])").forEach(cb=>cb.checked=e.target.checked);
    });
    container.appendChild(card);
  }

  $("#summary").textContent = data.count
    ? `合計 ${data.count} 件・回収可能 ${human(data.total_size)}（カテゴリを選んで「処理」）`
    : "候補は見つかりませんでした。";
}

function selectedIds() {
  return [...document.querySelectorAll(".pick:checked")].map(cb=>cb.dataset.id);
}
function selectedHighCount() {
  return [...document.querySelectorAll(".pick:checked")].filter(cb=>cb.dataset.risk==="2").length;
}

async function clean() {
  const ids = selectedIds();
  if (!ids.length) { alert("項目が選択されていません。"); return; }
  const apply = $("#applyChk").checked;
  const high = selectedHighCount();
  const mode = apply ? "実際に隔離します" : "ドライラン（練習・ファイルは動きません）";
  let msg = `${ids.length} 件を処理します。\nモード: ${mode}`;
  if (apply && high > 0) msg += `\n※ 高リスク（影響の可能性あり）を ${high} 件含みます。`;
  $("#confirmText").textContent = msg;
  $("#confirmDlg").showModal();
}

async function doClean(ids) {
  const apply = $("#applyChk").checked;
  const box = $("#result");
  box.hidden = false;
  box.className = "";
  box.innerHTML = "処理中…";
  try {
    const res = await fetch("/api/clean", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ids, apply})});
    const r = await res.json();
    renderResult(r);
    if (apply && !r.dry_run) { await scan(); await loadSessions(); }
  } catch (e) {
    box.className = "";
    box.innerHTML = "処理に失敗しました: " + e;
  }
}

function renderResult(r) {
  const box = $("#result");
  if (r.dry_run) {
    box.className = "dry";
    box.innerHTML = `<h2>🔍 ドライラン結果（まだ何も動かしていません）</h2>
      <p><strong>${r.quarantined} 件 / ${human(r.freed_bytes)}</strong> を隔離予定です。</p>
      <p class="hint">実際に隔離するには、上の「実際に隔離する」にチェックを入れてもう一度「処理」を押してください。</p>`;
  } else {
    box.className = "ok";
    let html = `<h2>✅ 隔離しました</h2>
      <p><strong>${r.quarantined} 件 / ${human(r.freed_bytes)}</strong> を隔離フォルダへ移動しました（削除ではありません）。</p>`;
    if (r.quarantine_dir) html += `<p class="hint">保存先: <code>${r.quarantine_dir}</code></p>`;
    if (r.session_id) html += `<p><button onclick="restore('${r.session_id}')">↩ この操作を元に戻す</button>
      <span class="hint">（下の「隔離履歴」からも復元できます）</span></p>`;
    if (r.skipped && r.skipped.length) html += `<p class="hint">${r.skipped.length} 件はスキップされました。</p>`;
    box.innerHTML = html;
  }
  box.scrollIntoView({behavior:"smooth", block:"nearest"});
}

async function loadSessions() {
  try {
    const res = await fetch("/api/sessions");
    const data = await res.json();
    const list = $("#sessionsList");
    list.innerHTML = "";
    if (!data.sessions.length) {
      $("#sessionsHint").textContent = "まだ隔離したものはありません。";
      return;
    }
    $("#sessionsHint").textContent = "各操作を丸ごと元の場所へ戻せます。";
    for (const s of data.sessions) {
      const div = document.createElement("div");
      div.className = "session";
      div.innerHTML = `<span><strong>${s.id}</strong> — ${s.count} 件 / ${human(s.total_size)}</span>
        <span style="display:flex; gap:.4rem;">
          <button class="secondary" onclick="restore('${s.id}')">↩ 復元</button>
          <button class="danger" onclick="purge('${s.id}', ${s.count}, '${human(s.total_size)}')">🗑 完全削除</button>
        </span>`;
      list.appendChild(div);
    }
  } catch (e) { /* sessions are best-effort */ }
}

async function purge(sessionId, count, sizeText) {
  if (!confirm(`⚠ セッション ${sessionId} の ${count} 件（${sizeText}）を完全に削除します。\nこの操作は取り消せません（復元できなくなります）。本当によろしいですか？`)) return;
  try {
    const res = await fetch("/api/purge", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({session_id: sessionId})});
    const r = await res.json();
    const box = $("#result");
    box.hidden = false; box.className = "";
    box.innerHTML = r.purged
      ? `<h2>🗑 完全に削除しました</h2><p>セッション <code>${sessionId}</code> を削除しました（復元不可）。</p>`
      : `<h2>削除対象が見つかりませんでした</h2>`;
    await loadSessions();
    box.scrollIntoView({behavior:"smooth", block:"nearest"});
  } catch (e) {
    alert("完全削除に失敗しました: " + e);
  }
}

async function restore(sessionId) {
  if (!confirm(`セッション ${sessionId} のファイルを元の場所へ戻します。よろしいですか？`)) return;
  try {
    const res = await fetch("/api/restore", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({session_id: sessionId})});
    const r = await res.json();
    const box = $("#result");
    box.hidden = false; box.className = "ok";
    box.innerHTML = `<h2>↩ 復元しました</h2><p><strong>${r.restored.length} 件</strong>を元の場所へ戻しました。`
      + (r.failed && r.failed.length ? ` （${r.failed.length} 件は失敗）` : "") + `</p>`;
    await loadSessions();
    box.scrollIntoView({behavior:"smooth", block:"nearest"});
  } catch (e) {
    alert("復元に失敗しました: " + e);
  }
}

$("#scanBtn").addEventListener("click", scan);
$("#cleanBtn").addEventListener("click", clean);
$("#confirmOk").addEventListener("click", ()=>{ $("#confirmDlg").close(); doClean(selectedIds()); });
$("#confirmCancel").addEventListener("click", ()=> $("#confirmDlg").close());
loadSessions();
</script>
</body>
</html>
